name: HelloGitHub Latest

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - ".github/workflows/github-weekly.yml"
      - "package.json"
      - "scripts/github-weekly-*.js"
      - "source/_data/github_weekly*.json"
      - "source/css/github-weekly.css"
      - "source/github-weekly/**"
      - "source/js/github-weekly.js"
      - "themes/yun/layout/github-weekly.pug"
      - "tools/github-weekly/**"
  schedule:
    # Check every day at 09:15 in Asia/Shanghai (01:15 UTC).
    # HelloGitHub normally publishes monthly; unchanged data creates no commit.
    - cron: "15 1 * * *"

concurrency:
  group: hellogithub-latest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEBLOG_DEPLOY_TOKEN: ${{ secrets.WEBLOG_DEPLOY_TOKEN }}

    steps:
      - name: Checkout weblog source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HelloGitHub sync tests
        run: npm run test:hellogithub

      - name: Sync latest HelloGitHub issue
        run: npm run hellogithub:update

      - name: Build Hexo site
        run: npm run build

      - name: Commit generated data
        id: source-commit
        shell: bash
        run: |
          git config user.name "hellogithub-sync[bot]"
          git config user.email "hellogithub-sync[bot]@users.noreply.github.com"
          git add source/_data/github_weekly.json source/_data/github_weekly_archive.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "content: sync latest HelloGitHub issue"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout production Pages repository
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: Wanglihan954/Wanglihan954.github.io
          token: ${{ env.WEBLOG_DEPLOY_TOKEN }}
          path: .weekly-deploy
          fetch-depth: 1

      - name: Publish generated site
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN != ''
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' public/ .weekly-deploy/
          cd .weekly-deploy
          git config user.name "hellogithub-sync[bot]"
          git config user.email "hellogithub-sync[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Production site is already current."
          else
            git commit -m "deploy: HelloGitHub ${GITHUB_SHA::7}"
            git push
          fi

      - name: Explain skipped production deployment
        if: github.ref == 'refs/heads/main' && env.WEBLOG_DEPLOY_TOKEN == ''
        run: echo "WEBLOG_DEPLOY_TOKEN is not configured; source data was updated but production deployment was skipped."
